spring.datasource.url=jdbc:h2:mem:localdb;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Local development: use a writable path inside the project instead of /app/uploads
storage.path=./uploads

# Vite dev server: the browser talks to :5173 and the proxy rewrites Host to
# :8083, so the Origin check must explicitly trust the dev origin.
resurs.auth.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs
springdoc.packagesToScan=se.comerit.resurs.api.v1.controller
