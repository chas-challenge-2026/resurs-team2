spring.datasource.url=jdbc:postgresql://db:5432/resurs
spring.datasource.username=resurs
spring.datasource.password=resurs123
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
server.port=8083
spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Server-side session tokens
session-token.idle-expiration-ms=900000            # session lifetime: 15 minutes of inactivity
session-token.sliding-expiration-enabled=true
session-token.sliding-on-access=true               # re-arm on every authenticated API call
session-token.absolute-expiration-ms=3600000       # absolute cap: 1 hour (0 = no cap)

# In-memory store cleanup
session-token.sweep-interval-ms=300000             # scheduled sweep every 5 min

# Trust X-Forwarded-For only behind a trusted reverse proxy
session-token.use-forwarded-header=false