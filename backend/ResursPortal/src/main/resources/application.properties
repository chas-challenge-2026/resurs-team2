spring.datasource.url=jdbc:postgresql://db:5432/resurs
spring.datasource.username=resurs
spring.datasource.password=resurs123
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
server.port=8083
spring.thymeleaf.cache=false

# Serve the React frontend from the root target/frontend/ dir
spring.web.resources.static-locations=file:../target/frontend/,classpath:/static/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Server-side session tokens
# session lifetime: 15 minutes of inactivity
session-token.idle-expiration-ms=900000
session-token.sliding-expiration-enabled=true
# absolute cap: 1 hour (0 = no cap)
session-token.absolute-expiration-ms=3600000

# In-memory store cleanup
# scheduled sweep every 5 min
session-token.sweep-interval-ms=300000

# Trust X-Forwarded-For only behind a trusted reverse proxy
session-token.use-forwarded-header=false


# ============================================================
# SCORING ENGINE CONFIGURATION
# All thresholds live here so they can be tuned without code changes.
# See META-INF/additional-spring-configuration-metadata.json for docs.
# ============================================================

# --- Solidity (equity / total capital) ---
resurs.scoring.solidity.reject = 0.20
resurs.scoring.solidity.flag = 0.25
resurs.scoring.solidity.good = 0.30

# --- Liquidity (current assets / current liabilities) ---
resurs.scoring.liquidity.reject = 1.0
resurs.scoring.liquidity.flag = 2.0
resurs.scoring.liquidity.good = 2.0
# Upper bound of the "near the limit" band (1.0 < liquidity < marginal) that is flagged
resurs.scoring.liquidity.marginal = 1.2

# --- Debt ratio (total liabilities / equity) ---
resurs.scoring.debt-ratio.reject = 3.0
resurs.scoring.debt-ratio.flag = 2.0
resurs.scoring.debt-ratio.good = 2.0

# --- Profit margin (operating income / net revenue) ---
resurs.scoring.profit-margin.reject = 0.02
resurs.scoring.profit-margin.flag = 0.02
resurs.scoring.profit-margin.good = 0.10

# --- Cash flow ratio (operating cash flow / total liabilities) ---
resurs.scoring.cash-flow.reject = 0.0
resurs.scoring.cash-flow.flag = 0.05
resurs.scoring.cash-flow.good = 0.05

# --- Interest coverage (operating income / interest expenses) ---
resurs.scoring.interest-coverage.reject = 1.5
resurs.scoring.interest-coverage.flag = 2.5
resurs.scoring.interest-coverage.good = 2.5

# --- Extra / standalone signal checks ---
# Large credit flagged above this amount (kr)
resurs.scoring.extra.large-credit-threshold = 5000000
# Credit amount that combined with low solvency triggers a flag (kr)
resurs.scoring.extra.large-credit-with-low-solvency = 1000000
# Solvency below which, combined with a large credit, triggers a flag
resurs.scoring.extra.low-solvency-threshold = 0.30
# Liabilities multiplier over revenue that is flagged
resurs.scoring.extra.high-debt-to-revenue-multiplier = 2.0
# Revenue below which is flagged (kr)
resurs.scoring.extra.low-revenue-threshold = 500000
# Equity below which is a hard rejection
resurs.scoring.extra.negative-equity-threshold = 0.0
# Operating income below which is flagged
resurs.scoring.extra.negative-income-threshold = 0.0
# Investing cash-flow magnitude relative to revenue that is flagged
resurs.scoring.extra.negative-investing-ratio = 0.3

# --- Combined-risk rules ---
# Minimum credit-to-revenue ratio before flagging
resurs.scoring.combination.credit-vs-revenue-minimum = 1.0
# Minimum equity-to-credit ratio before flagging
resurs.scoring.combination.equity-vs-credit-ratio = 0.3
# Debt-burden-to-revenue threshold that triggers a flag
resurs.scoring.combination.debt-burden-vs-revenue-threshold = 2.0

# Flag count from which a manual review is forced (any flag still triggers review)
resurs.scoring.review-flag-threshold = 2

# --- Application request constraints ---
resurs.application.requested-amount.min=50000
resurs.application.requested-amount.max=10000000

# --- Industry correction factors (multipliers) ---
resurs.scoring.industry-factors.BYGG = 0.85
resurs.scoring.industry-factors.HANDEL = 1.1
resurs.scoring.industry-factors.IT = 1.2
resurs.scoring.industry-factors.FASTIGHET = 0.9
resurs.scoring.industry-factors.TILLVERKNING = 0.95
resurs.scoring.industry-factors.TRANSPORT = 0.88
resurs.scoring.industry-factors.RESTAURANG = 0.80
resurs.scoring.industry-factors.FINANS = 1.15
resurs.scoring.industry-factors.VÅRD = 1.05
resurs.scoring.industry-factors.UTBILDNING = 1.0

# --- Industry benchmark averages: solvency ---
resurs.scoring.industry-averages.solidity.BYGG = 0.22
resurs.scoring.industry-averages.solidity.HANDEL = 0.28
resurs.scoring.industry-averages.solidity.IT = 0.45
resurs.scoring.industry-averages.solidity.FASTIGHET = 0.18
resurs.scoring.industry-averages.solidity.TILLVERKNING = 0.30
resurs.scoring.industry-averages.solidity.TRANSPORT = 0.20
resurs.scoring.industry-averages.solidity.RESTAURANG = 0.15
resurs.scoring.industry-averages.solidity.FINANS = 0.35
resurs.scoring.industry-averages.solidity.VÅRD = 0.38
resurs.scoring.industry-averages.solidity.UTBILDNING = 0.32

# --- Industry benchmark averages: debt ratio ---
resurs.scoring.industry-averages.debt-ratio.BYGG = 2.8
resurs.scoring.industry-averages.debt-ratio.HANDEL = 1.9
resurs.scoring.industry-averages.debt-ratio.IT = 0.8
resurs.scoring.industry-averages.debt-ratio.FASTIGHET = 3.5
resurs.scoring.industry-averages.debt-ratio.TILLVERKNING = 1.5
resurs.scoring.industry-averages.debt-ratio.TRANSPORT = 2.2
resurs.scoring.industry-averages.debt-ratio.RESTAURANG = 2.5
resurs.scoring.industry-averages.debt-ratio.FINANS = 1.2
resurs.scoring.industry-averages.debt-ratio.VÅRD = 0.9
resurs.scoring.industry-averages.debt-ratio.UTBILDNING = 1.1

# --- Industry benchmark averages: profit margin ---
resurs.scoring.industry-averages.margin.BYGG = 0.04
resurs.scoring.industry-averages.margin.HANDEL = 0.03
resurs.scoring.industry-averages.margin.IT = 0.15
resurs.scoring.industry-averages.margin.FASTIGHET = 0.12
resurs.scoring.industry-averages.margin.TILLVERKNING = 0.06
resurs.scoring.industry-averages.margin.TRANSPORT = 0.03
resurs.scoring.industry-averages.margin.RESTAURANG = 0.05
resurs.scoring.industry-averages.margin.FINANS = 0.18
resurs.scoring.industry-averages.margin.VÅRD = 0.07
resurs.scoring.industry-averages.margin.UTBILDNING = 0.08

# Fraction of the industry solidity average below which a flag is raised
resurs.scoring.industry-averages.solidity-comparison-ratio = 0.75
# Fraction of the industry margin average below which a flag is raised
resurs.scoring.industry-averages.margin-comparison-ratio = 0.5